cgi.fix_pathinfo = 0
max_execution_time = 1000
max_input_time = 1000
memory_limit = 4G
; Largest Filament upload field (Hotel documents) allows up to 10M; these
; give it headroom (post_max_size bounds the whole multipart request, so it
; must exceed upload_max_filesize) without exceeding nginx's client_max_body_size.
upload_max_filesize = 15M
post_max_size = 20M
;error_reporting=E_ALL
;display_errors=On
;display_startup_errors=On
